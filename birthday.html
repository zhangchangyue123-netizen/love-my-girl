<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Happy Birthday · 宝宝 ❤️
</title>


<link rel="stylesheet" href="css/birthday.css">


</head>


<body>


<!-- 背景音乐 -->

<audio id="birthdayMusic" loop>

    <source 
    src="assets/music/happy-birthday.mp3"
    type="audio/mpeg">

</audio>




<!-- Canvas 烟花 -->

<canvas id="fireworkCanvas"></canvas>




<!-- 主容器 -->

<main class="birthday-container">





<!-- ====================
     第一幕 星空
===================== -->

<section class="scene scene-star active">


<div class="scene-content">


<h1>
宝宝
</h1>


<p>
今晚的星空，
<br>
都是为你亮起的。
</p>


<button class="next-btn">
继续
</button>


</div>


</section>







<!-- ====================
     第二幕 蛋糕
===================== -->


<section class="scene scene-cake">


<div class="scene-content">


<div class="cake-box">


<img 
src="assets/images/cake.png"
alt="birthday cake">


</div>



<p>

为你准备了一份小小的惊喜

</p>



<button class="next-btn">

点亮蜡烛

</button>


</div>


</section>







<!-- ====================
     第三幕 蜡烛
===================== -->


<section class="scene scene-candle">


<div class="scene-content">


<div class="candle">


<div class="flame"></div>


</div>



<p>

许一个只属于你的愿望吧

</p>



<button class="next-btn">

许愿

</button>



</div>


</section>







<!-- ====================
     第四幕 烟花
===================== -->


<section class="scene scene-firework">


<div class="scene-content">


<h2>

愿你的每一天

</h2>


<p>

都像今晚一样闪耀

</p>


<button class="next-btn">

继续

</button>


</div>


</section>







<!-- ====================
     第五幕 照片
===================== -->


<section class="scene scene-photo">


<div class="photo-wall">


<img src="assets/images/photo1.jpg">

<img src="assets/images/photo2.jpg">

<img src="assets/images/photo3.jpg">

<img src="assets/images/photo4.jpg">

<img src="assets/images/photo5.jpg">

<img src="assets/images/photo6.jpg">

<img src="assets/images/photo7.jpg">


</div>



<button class="next-btn">

回忆

</button>



</section>







<!-- ====================
     第六幕 时间
===================== -->


<section class="scene scene-time">


<div class="scene-content">


<h2>
6.4
</h2>


<p>

从认识你的那一天开始

</p>



<h2>
8.20
</h2>


<p>

成为我最期待的日子

</p>



<button class="next-btn">

继续

</button>


</div>


</section>







<!-- ====================
     第七幕 告白
===================== -->


<section class="scene scene-love">


<div class="scene-content">


<p id="loveText">


想和你在一起一辈子哦


</p>



<button class="next-btn">

打开礼物

</button>


</div>


</section>







<!-- ====================
     第八幕 结尾
===================== -->


<section class="scene scene-end">


<div class="scene-content">


<h1>

宝宝

</h1>


<h2>

生日快乐 ❤️

</h2>



<p>

愿你每天都开心

<br>

愿你的未来永远有光

</p>



</div>


</section>





</main>



<script src="js/birthday.js"></script>


</body>


</html>
