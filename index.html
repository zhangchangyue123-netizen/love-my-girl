<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday ❤️</title>


    <!-- 首页样式 -->
    <link rel="stylesheet" href="css/style.css">


</head>


<body>


    <!-- 星空背景 -->
    <canvas id="starCanvas"></canvas>



    <!-- 页面遮罩 -->
    <div class="page-overlay"></div>



    <!-- 首页内容 -->

    <main class="hero">


        <section class="hero-content">


            <p class="mini-title">
                A Letter For You
            </p>



            <h1>
                Happy Birthday
            </h1>



            <p class="subtitle">

                今晚，<br>

                所有闪烁的星光，<br>

                都在祝你生日快乐。

            </p>



            <button id="enterBtn">

                开启今晚的惊喜 ✨

            </button>



            <p class="hint">

                轻轻点击，故事开始了。

            </p>


        </section>


    </main>




    <!-- 流星动画容器 -->

    <div id="meteorContainer"></div>



    <!-- 背景音乐 -->

    <audio id="bgm" loop preload="auto">

        <source src="assets/music/happy-birthday.mp3"
                type="audio/mpeg">

    </audio>



    <!-- 首页逻辑 -->

    <script src="js/main.js"></script>


</body>


</html>
