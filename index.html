```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#030205"
    >

    <title>For You</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

<main class="scene" id="scene">

    <!-- =========================
         夜空
    ========================== -->

    <div class="sky"></div>

    <div class="stars" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>


    <!-- =========================
         流星
    ========================== -->

    <div class="meteor" aria-hidden="true">
        <div class="meteor-tail"></div>
        <div class="meteor-head"></div>
    </div>


    <!-- =========================
         中央环境光
    ========================== -->

    <div class="ambient-glow"></div>


    <!-- =========================
         蛋糕场景
    ========================== -->

    <section class="cake-scene" aria-label="Birthday cake">

        <div class="cake-shadow"></div>

        <!-- 蜡烛产生的环境光 -->
        <div class="candle-light"></div>


        <!-- =====================
             蛋糕
        ====================== -->

        <div class="cake">

            <!-- 蜡烛 -->
            <div class="candles">

                <div class="candle candle-1">
                    <span class="wick"></span>
                    <span class="flame"></span>
                </div>

                <div class="candle candle-2">
                    <span class="wick"></span>
                    <span class="flame"></span>
                </div>

                <div class="candle candle-3">
                    <span class="wick"></span>
                    <span class="flame"></span>
                </div>

                <div class="candle candle-4">
                    <span class="wick"></span>
                    <span class="flame"></span>
                </div>

                <div class="candle candle-5">
                    <span class="wick"></span>
                    <span class="flame"></span>
                </div>

            </div>


            <!-- 顶层奶油 -->

            <div class="cake-top">

                <div class="cream cream-1"></div>
                <div class="cream cream-2"></div>
                <div class="cream cream-3"></div>
                <div class="cream cream-4"></div>

                <div class="top-strawberry strawberry-1"></div>
                <div class="top-strawberry strawberry-2"></div>
                <div class="top-strawberry strawberry-3"></div>

            </div>


            <!-- 草莓奶油夹层 -->

            <div class="cream-layer">

                <div class="layer-strawberry s1"></div>
                <div class="layer-strawberry s2"></div>
                <div class="layer-strawberry s3"></div>
                <div class="layer-strawberry s4"></div>
                <div class="layer-strawberry s5"></div>

            </div>


            <!-- 蛋糕胚 -->

            <div class="sponge sponge-top"></div>

            <div class="sponge sponge-bottom"></div>

        </div>

    </section>


    <!-- =========================
         漂浮光粒
    ========================== -->

    <div class="particles" aria-hidden="true">

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

    </div>


    <!-- =========================
         花瓣
    ========================== -->

    <div class="petals" aria-hidden="true">

        <span></span>
        <span></span>
        <span></span>

    </div>


    <!-- =========================
         开场按钮
    ========================== -->

    <button
        id="startButton"
        class="start-button"
        type="button"
        aria-label="开始生日祝福"
    >
        TAP TO BEGIN
    </button>

</main>


<script src="./script.js"></script>

</body>
</html>
